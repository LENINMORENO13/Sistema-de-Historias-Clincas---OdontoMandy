name: Deploy to AWS

on:
  push:
    branches:
      - despliegue-aws  

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www/html
            # Sincronizar código
            sudo git fetch --all
            sudo git reset --hard origin/despliegue-aws
            
            # Forzar permisos correctos en carpetas de escritura
            sudo chown -R www-data:www-data /var/www/html/writable
            sudo chmod -R 775 /var/www/html/writable
            
            # Crear carpetas si no existen y dar permisos
            sudo mkdir -p /var/www/html/writable/cache
            sudo mkdir -p /var/www/html/writable/logs
            sudo mkdir -p /var/www/html/writable/session
            sudo chmod -R 777 /var/www/html/writable/cache
            
            # Intentar limpiar la caché (con sudo para evitar el error que viste)
            sudo php spark cache:clear || echo "No se pudo limpiar la caché, pero el código se actualizó."