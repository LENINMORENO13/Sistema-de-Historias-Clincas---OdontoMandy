name: Deploy to AWS

on:
  push:
    branches:
      - despliegue-aws

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www/html
            # 1. Actualizar el código
            sudo git fetch --all
            sudo git reset --hard origin/despliegue-aws
            
            # 2. Reparar permisos de carpetas de escritura (Soluciona el error de Cache)
            sudo chown -R www-data:www-data /var/www/html/writable
            sudo chmod -R 775 /var/www/html/writable
            
            # 3. Asegurar que las subcarpetas existan
            sudo mkdir -p /var/www/html/writable/cache /var/www/html/writable/logs /var/www/html/writable/session
            sudo chmod -R 777 /var/www/html/writable/cache
            
            # 4. Limpiar la caché de CodeIgniter
            sudo php spark cache:clear || echo "Caché ya estaba limpia"